version: 2

models:
  - name: stg_crimes
    description: One row per reported Chicago crime incident, renamed and trimmed from the public crime table.
    columns:
      - name: crime_id
        description: Unique identifier for the incident.
        data_tests:
          - unique
          - not_null
      - name: case_number
        description: Chicago Police Department record number.
      - name: crime_timestamp
        description: Date and time the incident occurred.
        data_tests:
          - not_null
      - name: crime_date
        description: Calendar date of the incident.
      - name: crime_year
        description: Year of the incident.
        data_tests:
          - not_null
      - name: primary_type
        description: Primary crime category.
        data_tests:
          - not_null
      - name: crime_description
        description: Secondary description within the crime category.
      - name: location_description
        description: Type of place where the incident occurred.
      - name: is_arrest
        description: True if an arrest was made.
        data_tests:
          - not_null
      - name: is_domestic
        description: True if the incident was domestic-related.
        data_tests:
          - not_null
      - name: district
        description: Police district number. Missing for some records.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: ward
        description: City council ward number.
      - name: community_area
        description: Chicago community area number.
      - name: latitude
        description: Latitude of the incident, blurred to the block level.
      - name: longitude
        description: Longitude of the incident, blurred to the block level.