name: Deploy dbt docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}/chicago_crime/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: dbt deps
        working-directory: chicago_crime

      - name: Parse project
        run: dbt parse
        working-directory: chicago_crime

      - name: Generate docs
        run: dbt docs generate --empty-catalog --no-compile --no-populate-cache
        working-directory: chicago_crime

      - name: Prepare site
        run: |
          mkdir site
          cp chicago_crime/target/index.html chicago_crime/target/manifest.json chicago_crime/target/catalog.json site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4